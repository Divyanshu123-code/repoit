[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopilot-ml"
version = "0.1.0"
description = "RepoPilot AI - Defect prediction and ML modeling package"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/ml"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "scipy.*", "xgboost.*", "shap.*", "joblib.*"]
ignore_missing_imports = true

