name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff>=0.3.0"

      - name: Check Lint Rules
        run: ruff check .

      - name: Check Code Formatting
        run: ruff format --check .

  typecheck:
    name: Type Check (Mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API & Worker Dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install "mypy>=1.9.0"

      - name: Run Mypy Strict on API app/
        run: |
          cd apps/api
          mypy --strict app/

      - name: Run Mypy Strict on Worker
        run: |
          mypy --strict apps/worker/worker

  test:
    name: Automated Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Test Tools
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "httpx>=0.27.0" "pyyaml"

      - name: Run Repository Tests
        run: pytest -v tests/

      - name: Run API Tests
        run: |
          cd apps/api
          pytest -v tests/

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Web Docker Image
        run: docker build -t repopilot-web:ci apps/web

      - name: Build API Docker Image
        run: docker build -t repopilot-api:ci apps/api

      - name: Build Worker Docker Image
        run: docker build -t repopilot-worker:ci apps/worker

