[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopilot-worker"
version = "0.1.0"
description = "RepoPilot AI - Background Worker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

